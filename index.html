<!doctype html>

<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f19" />

    <title>Vocap Documentation</title>

    <meta
      name="description"
      content="Official documentation for Vocap: The offline video subtitle and transcript editor."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --brand: #6366f1;

        --brand-hover: #4f46e5;

        --brand-soft: rgba(99, 102, 241, 0.14);

        --brand-border: rgba(99, 102, 241, 0.35);

        --radius: 12px;

        --header-h: 64px;

        --font-sans: "Vazirmatn", Tahoma, system-ui, sans-serif;

        --font-mono: "JetBrains Mono", ui-monospace, monospace;
      }

      /* Dynamic Font Loading based on language */

      html[lang="en"] {
        --font-sans: "Inter", system-ui, -apple-system, sans-serif;
      }

      html[data-theme="dark"] {
        --bg: #0b0f19;

        --bg-elevated: #111827;

        --bg-subtle: #161f31;

        --bg-header: rgba(11, 15, 25, 0.85);

        --border: rgba(148, 163, 184, 0.16);

        --border-strong: rgba(148, 163, 184, 0.28);

        --text: #f1f5f9;

        --text-secondary: #cbd5e1;

        --text-muted: #94a3b8;

        --code-bg: #1e293b;

        --tip-bg: rgba(16, 185, 129, 0.1);

        --tip-border: rgba(16, 185, 129, 0.38);

        --tip-text: #34d399;

        --warn-bg: rgba(245, 158, 11, 0.1);

        --warn-border: rgba(245, 158, 11, 0.38);

        --warn-text: #fbbf24;

        --info-bg: rgba(99, 102, 241, 0.12);

        --info-border: rgba(99, 102, 241, 0.38);

        --info-text: #a5b4fc;

        --shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
      }

      html[data-theme="light"] {
        --bg: #ffffff;

        --bg-elevated: #f8fafc;

        --bg-subtle: #f1f5f9;

        --bg-header: rgba(255, 255, 255, 0.88);

        --border: #e2e8f0;

        --border-strong: #cbd5e1;

        --text: #0f172a;

        --text-secondary: #334155;

        --text-muted: #64748b;

        --code-bg: #f1f5f9;

        --tip-bg: #ecfdf5;

        --tip-border: #6ee7b7;

        --tip-text: #047857;

        --warn-bg: #fffbeb;

        --warn-border: #fcd34d;

        --warn-text: #b45309;

        --info-bg: #eef2ff;

        --info-border: #a5b4fc;

        --info-text: #4338ca;

        --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;

        scroll-padding-top: calc(var(--header-h) + 24px);
      }

      body {
        margin: 0;

        font-family: var(--font-sans);

        background: var(--bg);

        color: var(--text);

        line-height: 1.85;

        font-size: 15.5px;

        -webkit-font-smoothing: antialiased;
      }

      a {
        color: var(--brand);

        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      code {
        font-family: var(--font-mono);

        font-size: 0.86em;

        background: var(--code-bg);

        border: 1px solid var(--border);

        border-radius: 6px;

        padding: 0.12em 0.45em;

        direction: ltr;

        unicode-bidi: isolate;

        display: inline-block;
      }

      .ltr {
        direction: ltr;

        unicode-bidi: isolate;

        display: inline-block;
      }

      /* Top Header */

      .topbar {
        position: sticky;

        top: 0;

        z-index: 40;

        height: var(--header-h);

        background: var(--bg-header);

        backdrop-filter: blur(12px);

        -webkit-backdrop-filter: blur(12px);

        border-bottom: 1px solid var(--border);
      }

      .topbar-inner {
        max-width: 1440px;

        margin: 0 auto;

        height: 100%;

        padding: 0 20px;

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 12px;
      }

      .brand-group {
        display: flex;

        align-items: center;

        gap: 12px;
      }

      .menu-btn {
        display: none;

        width: 38px;

        height: 38px;

        border-radius: 9px;

        border: 1px solid var(--border);

        background: var(--bg-elevated);

        color: var(--text);

        cursor: pointer;

        align-items: center;

        justify-content: center;
      }

      .brand-link {
        display: flex;

        align-items: center;

        gap: 10px;

        color: var(--text);

        font-weight: 800;

        font-size: 1.12rem;
      }

      .brand-link:hover {
        text-decoration: none;
      }

      .brand-logo {
        width: 34px;

        height: 34px;

        border-radius: 10px;

        background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);

        color: #fff;

        display: grid;

        place-items: center;

        font-weight: 800;

        font-size: 0.95rem;

        box-shadow: 0 6px 18px rgba(99, 102, 241, 0.35);
      }

      .brand-sub {
        font-size: 0.78rem;

        font-weight: 600;

        color: var(--text-muted);

        border-right: 1px solid var(--border);

        padding-right: 10px;
      }

      html[lang="en"] .brand-sub {
        border-right: none;

        border-left: 1px solid var(--border);

        padding-right: 0;

        padding-left: 10px;
      }

      .topbar-actions {
        display: flex;

        align-items: center;

        gap: 10px;
      }

      /* Segmented Lang Switch */

      .lang-switch {
        display: flex;

        background: var(--bg-elevated);

        border: 1px solid var(--border);

        border-radius: 8px;

        padding: 2px;
      }

      .lang-btn {
        border: none;

        background: transparent;

        color: var(--text-muted);

        padding: 4px 10px;

        border-radius: 6px;

        font-size: 0.8rem;

        font-weight: 700;

        cursor: pointer;

        font-family: inherit;
      }

      .lang-btn.active {
        background: var(--bg-card);

        color: var(--text);

        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      }

      .version-select-wrap {
        position: relative;

        display: flex;

        align-items: center;
      }

      .version-select {
        appearance: none;

        font-family: var(--font-sans);

        font-size: 0.84rem;

        font-weight: 700;

        background: var(--brand-soft);

        color: var(--brand);

        border: 1px solid var(--brand-border);

        border-radius: 8px;

        padding: 6px 12px;

        cursor: pointer;

        outline: none;
      }

      .search-trigger {
        display: flex;

        align-items: center;

        gap: 8px;

        height: 36px;

        padding: 0 12px;

        border-radius: 9px;

        border: 1px solid var(--border);

        background: var(--bg-elevated);

        color: var(--text-muted);

        font-family: var(--font-sans);

        font-size: 0.85rem;

        cursor: pointer;

        min-width: 210px;

        justify-content: space-between;

        transition: border-color 0.15s ease;
      }

      .search-trigger:hover {
        border-color: var(--brand);

        color: var(--text);
      }

      .kbd {
        font-family: var(--font-mono);

        font-size: 0.72rem;

        padding: 1px 6px;

        border-radius: 5px;

        border: 1px solid var(--border-strong);

        background: var(--bg);

        color: var(--text-muted);

        direction: ltr;
      }

      .icon-btn {
        width: 36px;

        height: 36px;

        border-radius: 9px;

        border: 1px solid var(--border);

        background: var(--bg-elevated);

        color: var(--text);

        cursor: pointer;

        display: grid;

        place-items: center;

        font-size: 1rem;
      }

      .icon-btn:hover {
        border-color: var(--brand);
      }

      .header-link {
        font-size: 0.85rem;

        font-weight: 600;

        color: var(--text-secondary);

        padding: 6px 10px;

        border-radius: 8px;
      }

      .header-link:hover {
        background: var(--bg-subtle);

        text-decoration: none;
      }

      /* Layout */

      .layout {
        max-width: 1440px;

        margin: 0 auto;

        display: grid;

        grid-template-columns: 270px minmax(0, 1fr) 230px;

        gap: 32px;

        padding: 0 20px;
      }

      /* Sidebar */

      .sidebar {
        position: sticky;

        top: var(--header-h);

        height: calc(100vh - var(--header-h));

        overflow-y: auto;

        padding: 24px 0 40px 12px;

        border-left: 1px solid var(--border);
      }

      html[lang="en"] .sidebar {
        border-left: none;

        border-right: 1px solid var(--border);

        padding: 24px 12px 40px 0;
      }

      .nav-group {
        margin-bottom: 22px;
      }

      .nav-group-title {
        font-size: 0.76rem;

        font-weight: 800;

        color: var(--text-muted);

        padding: 0 10px;

        margin-bottom: 8px;
      }

      .nav-item {
        display: flex;

        align-items: center;

        gap: 8px;

        width: 100%;

        text-align: right;

        border: 0;

        background: transparent;

        color: var(--text-secondary);

        font-family: var(--font-sans);

        font-size: 0.9rem;

        font-weight: 500;

        padding: 7px 12px;

        border-radius: 8px;

        cursor: pointer;

        transition: color 0.14s ease;
      }

      html[lang="en"] .nav-item {
        text-align: left;
      }

      .nav-item:hover {
        background: var(--bg-subtle);

        color: var(--text);
      }

      .nav-item.active {
        background: var(--brand-soft);

        color: var(--brand);

        font-weight: 700;

        box-shadow: inset -3px 0 0 var(--brand);
      }

      html[lang="en"] .nav-item.active {
        box-shadow: inset 3px 0 0 var(--brand);
      }

      /* Main Content */

      .main {
        min-width: 0;

        padding: 32px 4px 64px;

        max-width: 820px;

        width: 100%;

        margin: 0 auto;
      }

      .doc-meta {
        display: flex;

        align-items: center;

        flex-wrap: wrap;

        gap: 10px;

        margin-bottom: 12px;

        font-size: 0.82rem;

        color: var(--text-muted);
      }

      .badge {
        display: inline-flex;

        align-items: center;

        gap: 5px;

        font-size: 0.76rem;

        font-weight: 700;

        padding: 2px 9px;

        border-radius: 6px;

        background: var(--brand-soft);

        color: var(--brand);

        border: 1px solid var(--brand-border);
      }

      .doc-title {
        margin: 0 0 10px;

        font-size: clamp(1.65rem, 2.8vw, 2.2rem);

        font-weight: 800;

        line-height: 1.3;
      }

      .doc-lead {
        margin: 0 0 28px;

        font-size: 1.04rem;

        color: var(--text-secondary);

        border-bottom: 1px solid var(--border);

        padding-bottom: 22px;
      }

      .prose h2 {
        margin: 34px 0 12px;

        font-size: 1.32rem;

        font-weight: 800;

        padding-bottom: 8px;

        border-bottom: 1px solid var(--border);

        display: flex;

        align-items: center;

        gap: 8px;
      }

      .prose h3 {
        margin: 24px 0 8px;

        font-size: 1.06rem;

        font-weight: 700;
      }

      .prose p {
        margin: 0 0 14px;

        color: var(--text-secondary);
      }

      .prose ul,
      .prose ol {
        margin: 0 0 16px;

        padding-inline-start: 22px;

        color: var(--text-secondary);
      }

      .prose li {
        margin-bottom: 7px;
      }

      .prose strong {
        color: var(--text);

        font-weight: 700;
      }

      .anchor-link {
        opacity: 0;

        color: var(--brand);

        font-weight: 700;

        transition: opacity 0.15s ease;
      }

      .prose h2:hover .anchor-link,
      .prose h3:hover .anchor-link {
        opacity: 1;
      }

      /* Callouts */

      .callout {
        border-radius: var(--radius);

        padding: 14px 16px;

        margin: 18px 0;

        border: 1px solid var(--border);

        border-inline-start-width: 4px;
      }

      .callout-title {
        font-weight: 800;

        font-size: 0.9rem;

        margin-bottom: 4px;

        display: flex;

        align-items: center;

        gap: 6px;
      }

      .callout p {
        margin: 0;

        font-size: 0.92rem;
      }

      .callout.tip {
        background: var(--tip-bg);

        border-color: var(--tip-border);
      }

      .callout.tip .callout-title {
        color: var(--tip-text);
      }

      .callout.warn {
        background: var(--warn-bg);

        border-color: var(--warn-border);
      }

      .callout.warn .callout-title {
        color: var(--warn-text);
      }

      .callout.info {
        background: var(--info-bg);

        border-color: var(--info-border);
      }

      .callout.info .callout-title {
        color: var(--info-text);
      }

      /* Cards & Steps */

      .steps {
        display: grid;

        gap: 12px;

        margin: 18px 0 22px;
      }

      .step-card {
        display: flex;

        gap: 14px;

        background: var(--bg-elevated);

        border: 1px solid var(--border);

        border-radius: var(--radius);

        padding: 14px 16px;
      }

      .step-num {
        flex-shrink: 0;

        width: 30px;

        height: 30px;

        border-radius: 8px;

        background: var(--brand-soft);

        color: var(--brand);

        border: 1px solid var(--brand-border);

        font-weight: 800;

        display: grid;

        place-items: center;

        font-size: 0.9rem;
      }

      .step-body h4 {
        margin: 0 0 4px;

        font-size: 0.98rem;

        color: var(--text);
      }

      .step-body p {
        margin: 0;

        font-size: 0.91rem;
      }

      .card-grid {
        display: grid;

        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

        gap: 12px;

        margin: 18px 0 22px;
      }

      .mini-card {
        background: var(--bg-elevated);

        border: 1px solid var(--border);

        border-radius: var(--radius);

        padding: 14px 16px;
      }

      .mini-card h4 {
        margin: 0 0 6px;

        font-size: 0.95rem;

        color: var(--text);
      }

      .mini-card p {
        margin: 0;

        font-size: 0.88rem;

        color: var(--text-muted);
      }

      /* Tables */

      .table-wrap {
        overflow-x: auto;

        margin: 16px 0 22px;

        border: 1px solid var(--border);

        border-radius: var(--radius);

        background: var(--bg-elevated);
      }

      table {
        width: 100%;

        border-collapse: collapse;

        font-size: 0.9rem;
      }

      th,
      td {
        padding: 11px 14px;

        text-align: start;

        border-bottom: 1px solid var(--border);
      }

      th {
        background: var(--bg-subtle);

        color: var(--text);

        font-weight: 700;

        font-size: 0.84rem;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      /* Pager */

      .pager {
        margin-top: 44px;

        padding-top: 22px;

        border-top: 1px solid var(--border);

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 14px;
      }

      .pager-btn {
        display: flex;

        flex-direction: column;

        gap: 3px;

        padding: 14px 16px;

        border-radius: var(--radius);

        border: 1px solid var(--border);

        background: var(--bg-elevated);

        cursor: pointer;

        text-align: start;

        font-family: var(--font-sans);
      }

      .pager-btn:hover {
        border-color: var(--brand);
      }

      .pager-dir {
        font-size: 0.76rem;

        color: var(--text-muted);
      }

      .pager-title {
        font-size: 0.95rem;

        font-weight: 700;

        color: var(--brand);
      }

      /* TOC */

      .toc {
        position: sticky;

        top: var(--header-h);

        height: calc(100vh - var(--header-h));

        overflow-y: auto;

        padding: 28px 8px 40px 0;
      }

      .toc-title {
        font-size: 0.76rem;

        font-weight: 800;

        color: var(--text-muted);

        margin-bottom: 10px;
      }

      .toc-list {
        list-style: none;

        margin: 0;

        padding: 0;

        border-inline-start: 1px solid var(--border);
      }

      .toc-link {
        display: block;

        padding: 5px 12px;

        font-size: 0.84rem;

        color: var(--text-muted);

        border-inline-start: 2px solid transparent;

        margin-inline-start: -1px;
      }

      .toc-link:hover {
        color: var(--text);

        text-decoration: none;
      }

      .toc-link.active {
        color: var(--brand);

        border-inline-start-color: var(--brand);

        font-weight: 700;
      }

      /* Search Modal */

      .modal-backdrop {
        position: fixed;

        inset: 0;

        z-index: 60;

        background: rgba(2, 6, 23, 0.68);

        backdrop-filter: blur(4px);

        display: none;

        align-items: flex-start;

        justify-content: center;

        padding: 80px 16px 24px;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .search-modal {
        width: 100%;

        max-width: 620px;

        background: var(--bg-elevated);

        border: 1px solid var(--border-strong);

        border-radius: 14px;

        box-shadow: var(--shadow);

        overflow: hidden;
      }

      .search-input-row {
        display: flex;

        align-items: center;

        gap: 10px;

        padding: 12px 16px;

        border-bottom: 1px solid var(--border);
      }

      .search-input {
        flex: 1;

        border: 0;

        background: transparent;

        color: var(--text);

        font-family: var(--font-sans);

        font-size: 1rem;

        outline: none;
      }

      .search-results {
        max-height: 390px;

        overflow-y: auto;

        padding: 10px;
      }

      .search-hit {
        display: block;

        width: 100%;

        text-align: start;

        background: transparent;

        border: 1px solid transparent;

        border-radius: 10px;

        padding: 10px 12px;

        cursor: pointer;

        font-family: var(--font-sans);

        margin-bottom: 4px;
      }

      .search-hit:hover {
        background: var(--brand-soft);

        border-color: var(--brand-border);
      }

      .search-hit-title {
        font-weight: 700;

        color: var(--text);

        font-size: 0.94rem;
      }

      .search-hit-cat {
        font-size: 0.76rem;

        color: var(--brand);

        margin-bottom: 2px;
      }

      .search-hit-snippet {
        font-size: 0.82rem;

        color: var(--text-muted);
      }

      .search-empty {
        text-align: center;

        padding: 28px 16px;

        color: var(--text-muted);

        font-size: 0.92rem;
      }

      .drawer-backdrop {
        display: none;

        position: fixed;

        inset: 0;

        z-index: 45;

        background: rgba(2, 6, 23, 0.6);
      }

      .drawer-backdrop.open {
        display: block;
      }

      @media (max-width: 1140px) {
        .layout {
          grid-template-columns: 250px minmax(0, 1fr);
        }

        .toc {
          display: none;
        }
      }

      @media (max-width: 860px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);

          gap: 0;
        }

        .menu-btn {
          display: inline-flex;
        }

        .brand-sub,
        .header-link {
          display: none;
        }

        .search-trigger {
          min-width: 0;

          width: 38px;

          padding: 0;

          justify-content: center;
        }

        .search-trigger .search-label,
        .search-trigger .kbd {
          display: none;
        }

        .sidebar {
          position: fixed;

          top: 0;

          inset-inline-end: -300px;

          width: 280px;

          height: 100vh;

          z-index: 50;

          background: var(--bg-elevated);

          padding: 20px 12px 40px;

          transition: inset-inline-end 0.2s ease;

          box-shadow: var(--shadow);
        }

        .sidebar.open {
          inset-inline-end: 0;
        }

        .pager {
          grid-template-columns: 1fr;
        }
      }

      /* Vocap shared visual system + responsive refinements */
      html[data-theme="dark"] {
        --bg-elevated: #151c2c;
        --bg-subtle: #1e293b;
        --bg-header: rgba(11, 15, 25, 0.86);
        --code-bg: #1e293b;
      }
      :root {
        --bg-card: #151c2c;
      }
      html[data-theme="light"] {
        --bg-card: #ffffff;
        --bg-elevated: #ffffff;
        --bg-subtle: #f1f5f9;
        --bg-header: rgba(248, 250, 252, 0.88);
        --code-bg: #f1f5f9;
        --brand: #4f46e5;
        --brand-hover: #4338ca;
        --brand-soft: rgba(79, 70, 229, 0.1);
        --brand-border: rgba(79, 70, 229, 0.3);
      }
      html,
      body {
        max-width: 100%;
      }
      html {
        overflow-x: clip;
      }
      body {
        min-width: 0;
        overflow-x: clip;
      }
      button,
      select,
      input {
        font: inherit;
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 3px;
      }
      .topbar-inner {
        width: 100%;
      }
      .topbar-actions,
      .brand-group,
      .brand-link {
        min-width: 0;
      }
      .layout {
        min-width: 0;
        align-items: start;
      }
      .sidebar,
      .main,
      .toc,
      #docRoot,
      .prose {
        min-width: 0;
      }
      .sidebar {
        overscroll-behavior: contain;
        scrollbar-gutter: stable;

              if (pos !== -1) {
                const start = Math.max(0, pos - 40);

                const end = Math.min(plain.length, pos + 90);

                snippet =
                  (start > 0 ? "…" : "") +
                  plain.slice(start, end) +
                  (end < plain.length ? "…" : "");
              }
            }

            hits.push({ page, snippet });
          }
        }

        el.searchResults.innerHTML = "";

        if (!hits.length) {
          el.searchResults.innerHTML = `<div class="search-empty">${i18n[state.lang].noResults}</div>`;

          return;
        }

        for (const hit of hits) {
          const btn = document.createElement("button");

          btn.className = "search-hit";

          btn.innerHTML = `

            <div class="search-hit-cat">${hit.page.group}</div>

            <div class="search-hit-title">${hit.page.title}</div>

            <div class="search-hit-snippet">${hit.snippet}</div>

          `;

          btn.onclick = () => {
            closeSearch();

            navigateTo(hit.page.id);
          };

          el.searchResults.appendChild(btn);
        }
      }

      function openSearch() {
        el.searchModal.classList.add("open");
        el.searchModal.setAttribute("aria-hidden", "false");
        el.searchInput.value = "";

        renderSearchResults("");

        setTimeout(() => el.searchInput.focus(), 30);
      }

      function closeSearch() {
        el.searchModal.classList.remove("open");
        el.searchModal.setAttribute("aria-hidden", "true");
      }

      // Init

      applyTheme(state.theme);

      setLang(state.lang);

      populateVersions();

      const initialAnchor = parseHash();

      renderPage();

      if (initialAnchor) {
        setTimeout(() => {
          const target = document.getElementById(initialAnchor);

          if (target) target.scrollIntoView();
        }, 100);
      }

      // Event Listeners

      el.versionSelect.addEventListener("change", (e) => {
        state.version = e.target.value;

        populateVersions();

        renderPage();

        updateHash();
      });

      el.themeBtn.addEventListener("click", () =>
        applyTheme(state.theme === "dark" ? "light" : "dark"),
      );

      el.menuBtn.addEventListener("click", openDrawer);

      el.drawerBackdrop.addEventListener("click", closeDrawer);

      el.searchBtn.addEventListener("click", openSearch);

      el.searchClose.addEventListener("click", closeSearch);

      el.searchModal.addEventListener("click", (e) => {
        if (e.target === el.searchModal) closeSearch();
      });

      el.searchInput.addEventListener("input", (e) =>
        renderSearchResults(e.target.value),
      );

      el.brandHome.addEventListener("click", (e) => {
        e.preventDefault();

        navigateTo("intro");
      });

      window.addEventListener("hashchange", () => {
        const a = parseHash();

        populateVersions();

        renderPage();
      });

      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();

          openSearch();
        } else if (e.key === "Escape") {
          closeSearch();

          closeDrawer();
        }
      });
    </script>
  </body>
</html>
